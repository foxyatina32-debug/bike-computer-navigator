<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d131b">
<meta name="robots" content="noindex">
<title>Велокомп закрыт</title>
<style>
  html,body{margin:0;height:100%;background:#0d131b;color:#e8edf2;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif}
  main{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px max(16px,env(safe-area-inset-left)) calc(24px + env(safe-area-inset-bottom));box-sizing:border-box;text-align:center}
  h1{margin:0;font-size:26px;font-weight:800}
  p{margin:0;max-width:340px;color:#9aa6b4;font-size:15px;line-height:1.45}
</style>
</head>
<body>
<main>
  <h1>Приложение закрыто</h1>
  <p>Велокомп больше недоступен по этому адресу. Иконку можно удалить с экрана «Домой».</p>
</main>
<script>
(() => {
  const l = ((navigator.languages && navigator.languages[0]) || navigator.language || 'ru').toLowerCase();
  if (l.startsWith('ru')) return;
  const he = l.startsWith('he') || l.startsWith('iw');
  const t = he ? ['האפליקציה סגורה', 'Velocomp כבר לא זמין בכתובת הזו. אפשר למחוק את הסמל ממסך הבית.']
               : ['The app is closed', 'Velocomp is no longer available at this address. You can remove the icon from the Home Screen.'];
  document.documentElement.lang = he ? 'he' : 'en'; if (he) document.documentElement.dir = 'rtl';
  document.title = t[0]; document.querySelector('h1').textContent = t[0]; document.querySelector('p').textContent = t[1];
})();
</script>
</body>
</html>
