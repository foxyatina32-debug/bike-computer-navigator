<!doctype html>
<html lang="ru">
<head>

<title>Велокомп выключен</title>
<style>

  main{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px max(16px,env(safe-area-inset-left)) calc(24px + env(safe-area-inset-bottom));box-sizing:border-box;text-align:center}
  .ic{width:84px;height:84px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12)}
  h1{margin:0;font-size:26px;font-weight:800}
  p{margin:0;max-width:340px;color:#9aa6b4;font-size:15px;line-height:1.45}
  a{margin-top:10px;display:inline-block;background:#e2e08a;color:#1c1d08;text-decoration:none;font-weight:800;font-size:17px;padding:15px 30px;border-radius:18px}
</style>
</head>
<body>
<main>
  <div class="ic"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#e2e08a" stroke-width="2.2" stroke-linecap="round"><path d="M12 3v8"/><path d="M6.3 6.8a8 8 0 1 0 11.4 0"/></svg></div>
  <h1>Велокомп выключен</h1>
  <p>GPS, компас, удержание экрана и голос остановлены — приложение ничего не делает и не расходует батарею. Поездка и маршрут сохранены.</p>
  <p>Чтобы убрать его совсем, смахните приложение вверх в переключателе приложений.</p>
  <a href="./" onclick="location.replace('./');return false">Включить снова</a>
</main>
</body>
</html>
